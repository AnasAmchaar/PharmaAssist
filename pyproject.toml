[project]
name = "pharma-assist"
version = "0.1.0"
description = "Agentic pharmacology research assistant (LangGraph: Plan -> ReAct tools -> Critic -> cited answer)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.4",
    "langchain-core==1.8.0",
    "langchain-openai==1.7.4",
    "langgraph==1.2.20",
    "numpy==2.4.6",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "rank-bm25==0.2.2",
    "uvicorn[standard]==0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/pharma_assist"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: requires a real LLM endpoint (deselect with -m 'not live')"]
addopts = "-m 'not live'"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.17.4",
]
